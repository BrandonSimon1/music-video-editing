[project]
name = "music-video-editing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "instaloader>=4.14.2",
    "librosa>=0.11.0",
    "matplotlib>=3.10.3",
    "moviepy>=2.2.1",
    "numpy>=1.26,<2",
    "psutil>=7.0.0",
    "scipy>=1.11.0",
    "soundfile>=0.13.1",
    "torch==2.2.2",
    "allin1>=1.1.0",
    "anthropic>=0.40.0",
    "pillow>=11.0.0",
    "pyyaml>=6.0.0",
]

[tool.uv]
# natten needs torch at build time but doesn't declare it. We override it
# to an impossible marker so uv skips it, then install natten manually after sync:
#   uv pip install natten==0.17.3 --no-build-isolation
# madmom git HEAD requires Cython compilation; override to skip and install manually:
#   uv pip install madmom --no-build-isolation
override-dependencies = [
    "natten; sys_platform == 'never'",
    "madmom; sys_platform == 'never'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
